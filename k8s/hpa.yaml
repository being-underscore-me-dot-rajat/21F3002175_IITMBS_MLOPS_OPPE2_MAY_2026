apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-api
  minReplicas: 1
  maxReplicas: 3            # Deliverable 4: hard ceiling of 3 pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
